name: Build Desktop Observer Binaries

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'desktop-observer/**'

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil requests pillow pytesseract
      
      - name: Copy correct entry point
        shell: pwsh
        run: |
          Copy-Item "desktop-observer/observer_main_correct.py" "desktop-observer/observer_main.py"
      
      - name: Build Windows executable
        run: |
          cd desktop-observer
          pyinstaller --onefile `
            --name "TransmogrifierObserver" `
            --add-data "cross_platform_observer.py;." `
            --hidden-import psutil `
            --hidden-import requests `
            --hidden-import PIL `
            --noconsole `
            observer_main.py
      
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: desktop-observer/dist/TransmogrifierObserver.exe
          retention-days: 30

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil requests pillow python-xlib
      
      - name: Copy correct entry point
        run: |
          cp desktop-observer/observer_main_correct.py desktop-observer/observer_main.py
      
      - name: Build Linux executable
        run: |
          cd desktop-observer
          pyinstaller --onefile \
            --name "TransmogrifierObserver" \
            --add-data "cross_platform_observer.py:." \
            --hidden-import psutil \
            --hidden-import requests \
            --hidden-import PIL \
            observer_main.py
      
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: desktop-observer/dist/TransmogrifierObserver
          retention-days: 30

  create-release:
    name: Create Release with Binaries
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: ./binaries/windows
      
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: ./binaries/linux
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-beta-${{ github.run_number }}
          name: Desktop Observer Binaries v1.0.0-beta-${{ github.run_number }}
          files: |
            binaries/windows/TransmogrifierObserver.exe
            binaries/linux/TransmogrifierObserver
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
