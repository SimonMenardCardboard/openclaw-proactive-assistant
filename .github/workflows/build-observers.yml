name: Build Desktop Observer Binaries

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'desktop-observer/**'

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil requests pillow pytesseract
      
      - name: Create entry point
        shell: pwsh
        run: |
          $mainScript = @'
          #!/usr/bin/env python3
          """
          Transmogrifier Desktop Observer - Windows
          """
          import sys
          import os
          import argparse
          import json
          import time
          import requests
          from datetime import datetime
          from cross_platform_observer import CrossPlatformObserver
          
          class ObserverAPI:
              def __init__(self, api_url: str, api_token: str):
                  self.api_url = api_url.rstrip('/')
                  self.api_token = api_token
                  self.observer = CrossPlatformObserver()
              
              def send_observation(self, observation: dict) -> bool:
                  try:
                      headers = {
                          'Authorization': f'Bearer {self.api_token}',
                          'Content-Type': 'application/json'
                      }
                      response = requests.post(
                          f'{self.api_url}/api/activity',
                          json=observation,
                          headers=headers,
                          timeout=10
                      )
                      return response.status_code == 200
                  except Exception as e:
                      print(f"❌ Failed to send: {e}")
                      return False
              
              def run(self, interval_minutes: int = 5):
                  print(f"🔄 Observer running (interval: {interval_minutes} min)")
                  while True:
                      try:
                          observation = self.observer.observe_session(interval_minutes)
                          observation['uploaded_at'] = datetime.utcnow().isoformat()
                          if self.send_observation(observation):
                              print(f"✅ Uploaded {len(observation.get('activities', []))} activities")
                          time.sleep(interval_minutes * 60)
                      except KeyboardInterrupt:
                          break
                      except Exception as e:
                          print(f"❌ Error: {e}")
                          time.sleep(60)
          
          def main():
              parser = argparse.ArgumentParser(description='Transmogrifier Desktop Observer')
              parser.add_argument('--api-url', required=True, help='VM API URL')
              parser.add_argument('--token', required=True, help='API token')
              parser.add_argument('--interval', type=int, default=5, help='Interval (minutes)')
              args = parser.parse_args()
              
              observer_api = ObserverAPI(args.api_url, args.token)
              observer_api.run(args.interval)
              return 0
          
          if __name__ == '__main__':
              sys.exit(main())
          '@
          Set-Content -Path "desktop-observer/observer_main.py" -Value $mainScript
      
      - name: Build Windows executable
        run: |
          cd desktop-observer
          pyinstaller --onefile `
            --name "TransmogrifierObserver" `
            --add-data "cross_platform_observer.py;." `
            --hidden-import psutil `
            --hidden-import requests `
            --hidden-import PIL `
            --noconsole `
            observer_main.py
      
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: desktop-observer/dist/TransmogrifierObserver.exe
          retention-days: 30

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil requests pillow python-xlib
      
      - name: Create entry point
        run: |
          cat > desktop-observer/observer_main.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Transmogrifier Desktop Observer - Linux
          """
          import sys
          import os
          import argparse
          import json
          import time
          import requests
          from datetime import datetime
          from cross_platform_observer import CrossPlatformObserver
          
          class ObserverAPI:
              def __init__(self, api_url: str, api_token: str):
                  self.api_url = api_url.rstrip('/')
                  self.api_token = api_token
                  self.observer = CrossPlatformObserver()
              
              def send_observation(self, observation: dict) -> bool:
                  try:
                      headers = {
                          'Authorization': f'Bearer {self.api_token}',
                          'Content-Type': 'application/json'
                      }
                      response = requests.post(
                          f'{self.api_url}/api/activity',
                          json=observation,
                          headers=headers,
                          timeout=10
                      )
                      return response.status_code == 200
                  except Exception as e:
                      print(f"❌ Failed to send: {e}")
                      return False
              
              def run(self, interval_minutes: int = 5):
                  print(f"🔄 Observer running (interval: {interval_minutes} min)")
                  while True:
                      try:
                          observation = self.observer.observe_session(interval_minutes)
                          observation['uploaded_at'] = datetime.utcnow().isoformat()
                          if self.send_observation(observation):
                              print(f"✅ Uploaded {len(observation.get('activities', []))} activities")
                          time.sleep(interval_minutes * 60)
                      except KeyboardInterrupt:
                          break
                      except Exception as e:
                          print(f"❌ Error: {e}")
                          time.sleep(60)
          
          def main():
              parser = argparse.ArgumentParser(description='Transmogrifier Desktop Observer')
              parser.add_argument('--api-url', required=True, help='VM API URL')
              parser.add_argument('--token', required=True, help='API token')
              parser.add_argument('--interval', type=int, default=5, help='Interval (minutes)')
              args = parser.parse_args()
              
              observer_api = ObserverAPI(args.api_url, args.token)
              observer_api.run(args.interval)
              return 0
          
          if __name__ == '__main__':
              sys.exit(main())
          PYEOF
      
      - name: Build Linux executable
        run: |
          cd desktop-observer
          pyinstaller --onefile \
            --name "TransmogrifierObserver" \
            --add-data "cross_platform_observer.py:." \
            --hidden-import psutil \
            --hidden-import requests \
            --hidden-import PIL \
            observer_main.py
      
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: desktop-observer/dist/TransmogrifierObserver
          retention-days: 30

  create-release:
    name: Create Release with Binaries
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: ./binaries/windows
      
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: ./binaries/linux
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-beta-${{ github.run_number }}
          name: Desktop Observer Binaries v1.0.0-beta-${{ github.run_number }}
          files: |
            binaries/windows/TransmogrifierObserver.exe
            binaries/linux/TransmogrifierObserver
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
